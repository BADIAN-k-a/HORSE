<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Surface</title>
    <style>
      body { margin: 0; overflow: hidden; }
      #enter-ar {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 28px;
        font-size: 18px;
        background: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 999;
      }
      #info {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 16px;
        font-family: sans-serif;
        text-shadow: 0 1px 4px #000;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <button id="enter-ar">Войти в AR</button>
    <div id="info"></div>

    <canvas id="canvas"></canvas>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js';
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/loaders/GLTFLoader.js';

      const canvas = document.getElementById('canvas');
      const info = document.getElementById('info');
      const btn = document.getElementById('enter-ar');

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // Освещение
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      let model = null;
      let placed = false;
      let hitTestSource = null;
      let hitTestSourceRequested = false;

      // Reticle — кружок-прицел на поверхности
      const reticleGeo = new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2);
      const reticleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const reticle = new THREE.Mesh(reticleGeo, reticleMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Загрузка модели
      const loader = new GLTFLoader();
      loader.load('bee.glb', (gltf) => {
        model = gltf.scene;
        model.scale.set(0.21, 0.21, 0.21);
        model.visible = false;
        scene.add(model);
      });

      // Запуск AR
      btn.addEventListener('click', async () => {
        if (!navigator.xr) {
          info.textContent = 'WebXR не поддерживается в этом браузере';
          return;
        }
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          info.textContent = 'AR не поддерживается на этом устройстве';
          return;
        }

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });

        renderer.xr.setReferenceSpaceType('local');
        await renderer.xr.setSession(session);
        btn.style.display = 'none';
        info.textContent = 'Наведите камеру на поверхность...';

        renderer.setAnimationLoop((timestamp, frame) => {
          if (!frame) return;

          const refSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();

          // Запрашиваем hit test source один раз
          if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then((viewerSpace) => {
              session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                hitTestSource = source;
              });
            });
            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);

            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0];
              const pose = hit.getPose(refSpace);

              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);

              // Ставим модель автоматически при первом обнаружении поверхности
              if (!placed && model) {
                model.position.setFromMatrixPosition(reticle.matrix);
                model.visible = true;
                placed = true;
                reticle.visible = false;
                info.textContent = '';
              }
            } else {
              reticle.visible = false;
            }
          }

          renderer.render(scene, camera);
        });
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
