<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Markerless AR</title>
<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
<a-scene
  renderer="colorManagement:true"
  xrweb="requiredFeatures: hit-test"
  webxr="optionalFeatures: hit-test local-floor">

  <a-assets>
    <a-asset-item id="beeModel" src="bee.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 1.6 0"></a-camera>

  <a-entity id="reticle"
            visible="false"
            position="0 0 -1">
  </a-entity>

</a-scene>

<script>
AFRAME.registerComponent("auto-place",{
init:function(){
const scene=this.el.sceneEl
const reticle=document.querySelector("#reticle")
const model=document.createElement("a-gltf-model")

model.setAttribute("src","#beeModel")
model.setAttribute("scale","0.21 0.21 0.21")

scene.renderer.xr.addEventListener("sessionstart",async()=>{
const session=scene.renderer.xr.getSession()
const viewerSpace=await session.requestReferenceSpace("viewer")
const refSpace=await session.requestReferenceSpace("local")

const hitTestSource=await session.requestHitTestSource({space:viewerSpace})

scene.renderer.setAnimationLoop((t,frame)=>{
if(!frame)return
const hits=frame.getHitTestResults(hitTestSource)
if(hits.length && !model.parentNode){
const pose=hits[0].getPose(refSpace)
model.object3D.position.set(
pose.transform.position.x,
pose.transform.position.y,
pose.transform.position.z
)
scene.appendChild(model)
}
})
})
}
})

document.querySelector("a-scene").setAttribute("auto-place","")
</script>

</body>
</html>
