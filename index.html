<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Surface2</title>
    <style>
      body { margin: 0; overflow: hidden; background: black; }
      #info {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 16px;
        font-family: sans-serif;
        text-shadow: 0 1px 4px #000;
        z-index: 999;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">Загрузка...</div>
    <canvas id="canvas"></canvas>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js';
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/loaders/GLTFLoader.js';

      const canvas = document.getElementById('canvas');
      const info = document.getElementById('info');

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      scene.add(new THREE.AmbientLight(0xffffff, 1.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      let model = null;
      let placed = false;
      let hitTestSource = null;
      let hitTestSourceRequested = false;

      const reticleGeo = new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2);
      const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const loader = new GLTFLoader();
      loader.load('bee.glb', (gltf) => {
        model = gltf.scene;
        model.scale.set(0.21, 0.21, 0.21);
        model.visible = false;
        scene.add(model);
        tryStartAR();
      }, undefined, (err) => {
        info.textContent = 'Ошибка загрузки модели: ' + err.message;
      });

      async function tryStartAR() {
        if (!navigator.xr) {
          info.textContent = 'WebXR не поддерживается. Нужен Chrome на Android.';
          return;
        }

        const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
        if (!supported) {
          info.textContent = 'AR не поддерживается на этом устройстве/браузере.';
          return;
        }

        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.body }
          });

          renderer.xr.setReferenceSpaceType('local');
          await renderer.xr.setSession(session);
          info.textContent = 'Наведите камеру на поверхность...';

          renderer.setAnimationLoop((timestamp, frame) => {
            if (!frame) return;

            const refSpace = renderer.xr.getReferenceSpace();
            const session = renderer.xr.getSession();

            if (!hitTestSourceRequested) {
              session.requestReferenceSpace('viewer').then((viewerSpace) => {
                session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                  hitTestSource = source;
                });
              });
              hitTestSourceRequested = true;
            }

            if (hitTestSource) {
              const results = frame.getHitTestResults(hitTestSource);
              if (results.length > 0) {
                const pose = results[0].getPose(refSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);

                if (!placed && model) {
                  model.position.setFromMatrixPosition(reticle.matrix);
                  model.visible = true;
                  placed = true;
                  reticle.visible = false;
                  info.textContent = '';
                }
              } else {
                reticle.visible = false;
              }
            }

            renderer.render(scene, camera);
          });

        } catch (e) {
          info.textContent = 'Ошибка запуска AR: ' + e.message;
        }
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
